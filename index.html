<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery & Videos</title>
  
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a; /* Dark background */
      color: #f8fafc;
      padding: 20px;
      min-height: 100vh;
    }

    /* Header Section */
    header {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 2.3rem;
      color: #f43f5e; /* Rose pink color */
      margin-bottom: 8px;
    }

    header p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    /* Grid Layout for Photos & Videos */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
